# pyproject.toml — melodia_py
# Replace every <PLACEHOLDER> before publishing to PyPI.

[build-system]
requires      = ["setuptools>=70.0,<72", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------

[project]
name        = "melodia-py"
version     = "0.1.8"
description = "Protein and RNA/DNA/XNA geometry analysis"
readme      = "README.md"
license     = { text = "Apache-2.0" }
requires-python = ">=3.10"

authors = [
    { name = "Rinaldo Wander Montalvão" },
]

keywords = [
    "bioinformatics",
    "protein structure",
    "differential geometry",
    "structural alignment",
    "PDB",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

# ---------------------------------------------------------------------------
# Core runtime dependencies
# Versions are lower-bounded at what is tested in the conda environment;
# upper bounds are intentionally omitted to avoid unnecessary breakage.
# ---------------------------------------------------------------------------

dependencies = [
    "biopython>=1.85",
    "numpy>=2.0",
    "scipy>=1.15",
    "pandas>=2.3",
    "scikit-learn>=1.7",
    "seaborn>=0.13",
    "matplotlib>=3.10",
    "sty>=1.0",          # terminal colour output in show_align()
    "importlib_resources>=6.4",
    "dill>=0.4",
    # Imported by the geometry code on every import of melodia_py:
    "numba>=0.61",       # JIT writhing kernel; 0.61 is the first with Python 3.13
    "joblib>=1.4",       # parallel processing across models (n_jobs)
]

# ---------------------------------------------------------------------------
# Optional dependency groups
#
# Install with:
#   pip install melodia-py[viz]           # NGLView structure viewers (notebooks)
#   pip install melodia-py[mdanalysis]    # MDAnalysis trajectory support
#   pip install melodia-py[dev]           # testing + linting tools
#   pip install melodia-py[all]           # everything above
#
# fast and parallel are kept so existing install commands keep working;
# numba and joblib are now core dependencies.
# ---------------------------------------------------------------------------

[project.optional-dependencies]

fast = [
    # Now a core dependency; kept for compatibility.
    "numba>=0.61",
]

parallel = [
    # Now a core dependency; kept for compatibility.
    "joblib>=1.4",
]

viz = [
    # view_putty(), view_cartoon(), view_tube() in Jupyter notebooks.
    # NGLView can be hard to install with pip; conda-forge works well.
    "nglview>=3.1",
    "ipywidgets>=8.1",
]

mdanalysis = [
    # Required by geometry_from_mdanalysis().
    # Supports GROMACS (TPR+XTC), AMBER, CHARMM DCD, mmCIF, and all other
    # formats that MDAnalysis can read.
    "MDAnalysis>=2.7",
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",          # linter + formatter
    "pre-commit>=3.7",
    "types-setuptools",
]

all = [
    "melodia-py[viz]",
    "melodia-py[mdanalysis]",
    "melodia-py[dev]",
]

# ---------------------------------------------------------------------------
# URLs
# ---------------------------------------------------------------------------

[project.urls]
Homepage      = "https://github.com/rwmontalvao/Melodia_py"
Repository    = "https://github.com/rwmontalvao/Melodia_py"
"Bug Tracker" = "https://github.com/rwmontalvao/Melodia_py/issues"

# ---------------------------------------------------------------------------
# Package discovery
# setuptools will find all packages under src/ if you use the src layout,
# or auto-discover from the project root (current layout).
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where   = ["."]
include = ["melodia_py*"]
exclude = ["tests*", "docs*"]

# Include non-Python data files bundled inside the package
# (e.g. melodia_py/data/luthier.dat used by PropensityTable).

[tool.setuptools.package-data]
"melodia_py" = ["data/*"]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short --cov=melodia_py --cov-report=term-missing"

[tool.mypy]
python_version         = "3.10"
strict                 = true
ignore_missing_imports = true   # biopython has incomplete stubs

[tool.ruff]
target-version = "py310"
line-length    = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "NPY", # numpy-specific rules
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in default arguments
]
